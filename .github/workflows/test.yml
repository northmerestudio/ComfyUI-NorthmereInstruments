name: Verify Northmere Instruments

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest ruff
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check northmere_instruments --select E4,E7,E9,F
      - run: python -m pytest -q
      - run: python -m compileall -q northmere_instruments
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --input-type=module --check < web/curve.js
      - run: node tests/ui_smoke.cjs
      - if: matrix.python-version == '3.12'
        run: |
          python scripts/build_release.py /tmp/northmere-ci-release.zip
          python scripts/check_release.py /tmp/northmere-ci-release.zip

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
